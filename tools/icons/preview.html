<!doctype html>
<html><head><meta charset="utf-8"><title>Farcade icons</title>
<style>
:root{--bg:#191B20;--fg:#DCDFE4;--dim:#8B919C;--sel:#6EA3FF;--card:#20232A;--line:#2C3038;--selbg:#6EA3FF22}
body.light{--bg:#F4F5F7;--fg:#1C1F24;--dim:#6B7280;--sel:#2F6FE0;--card:#FFFFFF;--line:#DDE0E5;--selbg:#4C8DFF1F}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:12px/1.3 system-ui,sans-serif;width:1360px}
h1{font-size:15px;margin:0 0 4px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;font-weight:600}
.sub{color:var(--dim);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.card.sel{background:var(--selbg);color:var(--sel);border-color:var(--sel)}
.name{font-size:11px;color:var(--dim);margin-bottom:6px;font-family:ui-monospace,monospace}
.card.sel .name{color:var(--sel)}
.row{display:flex;align-items:flex-end;gap:12px}
.row svg{display:block;flex:none}
.tools{display:flex;gap:6px;margin:6px 0}
.tools span{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--line)}
.tools span.act{background:var(--sel);color:#fff;border-color:var(--sel)}
</style></head>
<body>
<h1>Farcade Engine icons</h1>
<div class="sub">14 / 16 / 20 / 24 / 48 px - names are file names in editor/icons/</div>
<div id="out"></div>
<script>
const {ICONS, GROUPS, SELECTED} = window.__DATA__;
document.body.classList.toggle('light', window.__DATA__.THEME === 'light');
const out = document.getElementById('out');
const SIZES = [14,16,20,24,48];
const mk = (svg, px) => svg.replace('<svg ', '<svg width="'+px+'" height="'+px+'" ').replace(/ width="24" height="24"/, '');
let html = '';
for (const [title, names] of GROUPS) {
  html += '<h2>'+title+'</h2><div class="grid">';
  for (const n of names) {
    html += '<div class="card'+(SELECTED.includes(n)?' sel':'')+'"><div class="name">'+n+'</div><div class="row">'
      + SIZES.map(s=>mk(ICONS[n], s)).join('') + '</div></div>';
  }
  html += '</div>';
}
out.innerHTML = html;
</script>
</body></html>
